# /etc/ssh/sshd_config.d/01-hardening.conf
#
# NOTE ON FILENAME: sshd takes the FIRST occurrence of a setting, not the
# last. Ubuntu ships 50-cloud-init.conf with PasswordAuthentication yes,
# so this file must sort BEFORE it. Install it as 01-hardening.conf.
#
# Verify what is actually in effect with:
#   sudo sshd -T | grep -iE 'passwordauthentication|permitrootlogin'

PasswordAuthentication no
PermitRootLogin no
